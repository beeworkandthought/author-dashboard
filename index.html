<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="작가 대시보드">
<title>작가 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f0;
    color: #1a1a1a;
    min-height: 100vh;
  }
  header {
    background: #1a1a1a;
    color: #fff;
    padding: 20px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .updated { font-size: 12px; color: #888; margin-left: auto; }
  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 2px solid #e0e0e0;
    padding: 0 20px;
  }
  .tab {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #888;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
  .tab-content { display: none; padding: 20px 16px; }
  .tab-content.active { display: block; }
  .grid { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .card-header { margin-bottom: 12px; }
  .card-header h2 { font-size: 16px; font-weight: 700; }
  .keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .keyword {
    background: #f0f0eb;
    color: #444;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .news-list { list-style: none; }
  .news-list li {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    line-height: 1.4;
  }
  .news-list li:last-child { border-bottom: none; }
  .news-list a {
    color: #1a1a1a;
    text-decoration: none;
    font-size: 14px;
    display: block;
    margin-bottom: 3px;
  }
  .meta { font-size: 11px; color: #aaa; }
  .empty { color: #bbb; font-size: 13px; padding: 10px 0; }
  .events-section {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .events-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .events-list { list-style: none; }
  .events-list li {
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .events-list li:last-child { border-bottom: none; }
  .event-author {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: #1a1a1a;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .events-list a {
    color: #1a1a1a;
    text-decoration: none;
    font-size: 14px;
    display: block;
    margin-bottom: 3px;
  }
</style>
</head>
<body>
<header>
  <h1>작가 대시보드</h1>
  <span class="updated">2026년 07월 20일 03:26 기준</span>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('news', this)">뉴스 피드</div>
  <div class="tab" onclick="switchTab('events', this)">이벤트</div>
</div>
<div id="tab-news" class="tab-content active">
  <div class="grid">
        <div class="card">
            <div class="card-header"><h2>한강</h2></div>
            <div class="keywords"></div>
            <ul class="news-list"><li class='empty'>최근 뉴스가 없습니다.</li></ul>
        </div>
        <div class="card">
            <div class="card-header"><h2>박해영</h2></div>
            <div class="keywords"></div>
            <ul class="news-list"><li class='empty'>최근 뉴스가 없습니다.</li></ul>
        </div>
        <div class="card">
            <div class="card-header"><h2>무라카미 하루키</h2></div>
            <div class="keywords"></div>
            <ul class="news-list"><li class='empty'>최근 뉴스가 없습니다.</li></ul>
        </div>
        <div class="card">
            <div class="card-header"><h2>다자이 오사무</h2></div>
            <div class="keywords"></div>
            <ul class="news-list"><li class='empty'>최근 뉴스가 없습니다.</li></ul>
        </div>
        <div class="card">
            <div class="card-header"><h2>베르나르 베르베르</h2></div>
            <div class="keywords"></div>
            <ul class="news-list"><li class='empty'>최근 뉴스가 없습니다.</li></ul>
        </div></div>
</div>
<div id="tab-events" class="tab-content">
  <div class="events-section">
    <h2>사인회 · 낭독회 · 북토크 · 시사회</h2>
    <ul class="events-list"><li class='empty'>현재 등록된 이벤트 소식이 없습니다.</li></ul>
  </div>
</div>
<script>
function switchTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
}
</script>
</body>
</html>
